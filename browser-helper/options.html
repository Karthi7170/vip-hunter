<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VIP-Hunter Apply Assistant</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#f4f7f5;color:#102018;margin:0;padding:32px}.wrap{max-width:720px;margin:auto;background:#fff;border:1px solid #dfe7e2;border-radius:20px;padding:24px;box-shadow:0 12px 40px #173e2c12}h1{margin:0 0 8px;font-size:28px}p{color:#64746b;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#34443c}input,textarea{font:inherit;border:1px solid #cedbd4;border-radius:10px;padding:11px;background:#fff}textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}button{margin-top:18px;border:0;border-radius:10px;background:#153c2b;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.note{font-size:12px;background:#f5faf7;border:1px solid #d9e8df;padding:12px;border-radius:10px}.ok{margin-left:10px;color:#267448;font-size:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>VIP-Hunter Apply Assistant</h1>
    <p>Save your verified profile once. The extension uses it only to fill common fields on supported ATS pages in your browser.</p>
    <div class="note">The helper does not submit applications, solve CAPTCHA/OTP, sign in to sites, or invent answers. Review every field before submitting.</div>
    <div class="grid">
      <label>Full name<input id="fullName" autocomplete="name" /></label>
      <label>Email<input id="email" type="email" autocomplete="email" /></label>
      <label>Phone<input id="phone" autocomplete="tel" /></label>
      <label>City<input id="city" /></label>
      <label>LinkedIn URL<input id="linkedin" type="url" /></label>
      <label>Portfolio URL<input id="portfolio" type="url" /></label>
      <label class="wide">Current / latest job title<input id="currentTitle" /></label>
      <label class="wide">Education summary<textarea id="education" placeholder="Example: MCA, SRM University Chennai, 2023–2025"></textarea></label>
    </div>
    <button id="save">Save profile</button><span class="ok" id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
